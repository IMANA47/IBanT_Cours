# SLF4J Simple Logger Configuration
# Default logging level
org.slf4j.simpleLogger.defaultLogLevel=info

# Show date time in logs
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show logger name
org.slf4j.simpleLogger.showLogName=true

# Show short logger name (only the last part)
org.slf4j.simpleLogger.shortLogName=true

# Log level for specific packages
org.slf4j.simpleLogger.log.org.gstudent=debug
org.slf4j.simpleLogger.log.org.gstudent.config=info
org.slf4j.simpleLogger.log.org.gstudent.service=debug
